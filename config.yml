  mnemonic: "advice cage absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid negative"
- name: dex_liquidity
  coins:
  - 17777777600000uferac
  mnemonic: "agree choice donor anxiety expect little beef pass agree choice donor anxiety expect little beef pass agree choice donor anxiety expect little beef sample"
- name: treasury
  coins:
  - 13333333200000uferac
  mnemonic: "alcohol coral light army gather adapt blossom school alcohol coral light army gather adapt blossom school alcohol coral light army gather adapt blossom tackle"
- name: ecosystem
