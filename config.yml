# The four genesis validators are funded out of the community allocation and are
# intentionally equal in stake and independently controlled.
- name: val1
  coins:
  - 2000000000000uferac
  mnemonic: "amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice cage again"
- name: val2
  coins:
