version: 1
validation: sovereign
default_denom: uferac

# ---------------------------------------------------------------------------
# FOREVERGALACTIC (FERAC) genesis distribution of the fixed 88,888,888 FERAC
# supply. 1 FERAC = 1,000,000 uferac (6 decimals). Minting is disabled, so no
# token can ever exist beyond what is listed here.
#
# Category           %      FERAC             uferac
# Creator            10%    8,888,888.8       8,888,888,800,000
# Team                3%    2,666,666.64      2,666,666,640,000
# Validator Reserve   4%    3,555,555.52      3,555,555,520,000
# Community          35%   31,111,110.8      31,111,110,800,000  (8,000,000 FERAC
#                                             of it seeds the 4 genesis validators)
# DEX Liquidity      20%   17,777,777.6      17,777,777,600,000
# Treasury           15%   13,333,333.2      13,333,333,200,000
# Ecosystem          13%   11,555,555.44     11,555,555,440,000
# Total             100%   88,888,888        88,888,888,000,000
#
# The mnemonics below are deterministic development keys. Replace them with
# independently generated keys before launching a public network.
# ---------------------------------------------------------------------------
accounts:
- name: creator
  coins:
  - 8888888800000uferac
  mnemonic: "absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice comic"
- name: team
