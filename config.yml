  mnemonic: "animal embark drastic bamboo mountain loyal category cancel animal embark drastic bamboo mountain loyal category cancel animal embark drastic bamboo mountain loyal category cover"
- name: val3
  coins:
  - 2000000000000uferac
  mnemonic: "anxiety expect little beef pass agree choice donor anxiety expect little beef pass agree choice donor anxiety expect little beef pass agree choice fire"
- name: val4
  coins:
