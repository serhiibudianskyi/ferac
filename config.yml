genesis:
  consensus:
    params:
      block:
        # Target throughput of ~1,000 TPS at an ~8 second block time.
        max_bytes: "22020096"
        max_gas: "400000000"
  app_state:
    bank:
      denom_metadata:
      - description: "FOREVERGALACTIC"
        denom_units:
        - denom: uferac
          exponent: 0
        - denom: FERAC
          exponent: 6
        base: uferac
        display: FERAC
        name: FOREVERGALACTIC
        symbol: FERAC
    staking:
      params:
        bond_denom: uferac
        # Delegators unbond in 30 minutes. A validator reducing its own stake
        # must additionally serve the 14 day exit notice enforced by x/ferac.
        unbonding_time: "1800s"
        max_validators: 100
        max_entries: 7
        historical_entries: 10000
    mint:
      minter:
        inflation: "0.000000000000000000"
        annual_provisions: "0.000000000000000000"
      params:
        mint_denom: uferac
        # Inflation is pinned to zero: the 88,888,888 FERAC supply is fixed and
        # no additional mint is possible.
        inflation_rate_change: "0.000000000000000000"
        inflation_max: "0.000000000000000000"
        inflation_min: "0.000000000000000000"
        goal_bonded: "0.670000000000000000"
        blocks_per_year: "3942000"
    distribution:
      params:
        community_tax: "0.000000000000000000"
        withdraw_addr_enabled: true
    slashing:
      params:
        signed_blocks_window: "10000"
        min_signed_per_window: "0.500000000000000000"
        downtime_jail_duration: "600s"
        # Short downtime is not slashed at all; sustained downtime costs the
        # validator half of its own stake.
        slash_fraction_downtime: "0.500000000000000000"
        # Double signing (equivocation) costs 25%.
        slash_fraction_double_sign: "0.250000000000000000"
    gov:
      params:
        min_deposit:
        - denom: uferac
          amount: "10000000000"
        expedited_min_deposit:
        - denom: uferac
          amount: "50000000000"
        max_deposit_period: "172800s"
        # 7 day voting period acts as the timelock before a decision executes.
        voting_period: "604800s"
        expedited_voting_period: "86400s"
        quorum: "0.334000000000000000"
        # Tallying is strictly greater-than, so 0.70 is the threshold that lets
        # exactly 3 of the 4 equally weighted genesis validators pass a regular
        # proposal, while 2 of 4 (0.50) fails.
        threshold: "0.700000000000000000"
        # Expedited (technical) proposals require more than 3 of 4, i.e. the
        # unanimous consent of the genesis set.
        expedited_threshold: "0.750000000000000000"
        veto_threshold: "0.334000000000000000"
        burn_vote_quorum: false
        burn_proposal_deposit_prevote: false
        burn_vote_veto: true
    ferac:
      params:
        denom: uferac
        max_supply: "88888888000000"
        restricted_release_rate: "0.250000000000000000"
        restricted_period_seconds: "31536000"
        reserve_release_rate: "0.050000000000000000"
        reserve_period_seconds: "31536000"
        stake_weight: "0.400000000000000000"
        uptime_weight: "0.400000000000000000"
        quality_weight: "0.200000000000000000"
        network_fee_rate: "0.000100000000000000"
        network_fee_validator_share: "0.500000000000000000"
        dex_fee_rate: "0.000200000000000000"
        max_validator_stake_share: "0.200000000000000000"
        min_self_delegation: "1000000000"
        validator_unbonding_seconds: "1209600"
        genesis_validator_count: 4
        genesis_finality_threshold: 3
        supermajority_threshold: "0.666666666666666667"
        validator_commission_rate: "0.050000000000000000"
        treasury_address: "cosmos1lgdhj06gwvn0469jscassquv8rcf2pyypqr6z2"
        max_validators_per_operator: 1
      validator_reserve:
        remaining: "3555555520000"
        last_epoch_time: "0"
        epoch: "0"
      reserve_funder: "cosmos16rrc44wwf62n5qf28f9mjghqy0y3jdcygsrval"
