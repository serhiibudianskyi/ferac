  mnemonic: "arch flame security bid radar machine club gesture arch flame security bid radar machine club gesture arch flame security bid radar machine club lawn"

client:
  openapi:
    path: docs/static/openapi.json

# 4 independent genesis validators, equal stake, 3-of-4 finality.
validators:
- name: val1
  bonded: 1000000000000uferac
  config:
    consensus:
      timeout_commit: "8s"
      timeout_propose: "3s"
  gentx:
    commission-rate: "0.05"
    commission-max-rate: "0.05"
    commission-max-change-rate: "0.00"
    min-self-delegation: "1000000000"
- name: val2
  bonded: 1000000000000uferac
  config:
    consensus:
      timeout_commit: "8s"
      timeout_propose: "3s"
  gentx:
    commission-rate: "0.05"
    commission-max-rate: "0.05"
    commission-max-change-rate: "0.00"
    min-self-delegation: "1000000000"
- name: val3
  bonded: 1000000000000uferac
  config:
