syntax = "proto3";
package ferac.ferac.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/serhiibudianskyi/ferac/x/ferac/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "ferac/x/ferac/Params";
  option (gogoproto.equal) = true;
}
