name: Build Ferac Binary

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build feracd binary
        run: |
          go build -o feracd ./cmd/feracd

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: feracd
          path: feracd
